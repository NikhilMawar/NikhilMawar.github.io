<!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />

      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
      />

      <!-- Theme -->
      <meta name="theme-color" content="#EFECE4" />

      <!-- iOS -->
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <!--
        No apple-mobile-web-app-status-bar-style here on purpose.
        It only applies to standalone/home-screen installs (not regular
        Safari tabs), it's a static value that can't follow light/dark
        theme switches, and a hardcoded "black-translucent" was fighting
        the dynamic theme-color meta that App.jsx already keeps in sync.
      -->
      <meta
        name="apple-mobile-web-app-title"
        content="Nikhil Mawar"
      />

      <!-- Android -->
      <meta
        name="mobile-web-app-capable"
        content="yes"
      />

      <title>Nikhil Mawar — Product Designer</title>
    </head>
    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.jsx"></script>
    </body>
  </html>
